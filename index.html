<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Checker Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a30;
      --panel-2: #182445;
      --text: #eaf0ff;
      --muted: #94a3c4;
      --occupied: #3ddc84;
      --vacant: #facc15;
      --alerted: #ef4444;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 500px at 10% 10%, #1a2b57 0%, transparent 60%),
        radial-gradient(1000px 500px at 90% 90%, #31205d 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    .dashboard {
      width: min(760px, 100%);
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      text-align: center;
      transition: transform 260ms ease, opacity 260ms ease;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.5rem, 2vw + 1rem, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .status-card {
      border-radius: 20px;
      padding: 24px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background-color 300ms ease, border-color 300ms ease, transform 300ms ease;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: clamp(1.8rem, 2vw + 1.1rem, 2.8rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 260ms ease, transform 260ms ease;
    }

    .subtext {
      margin-top: 10px;
      color: var(--muted);
      font-size: 1rem;
      min-height: 24px;
    }

    .progress-wrap {
      margin: 22px auto 8px;
      width: min(520px, 90%);
      text-align: left;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #fde047, #fb923c, #ef4444);
      transition: width 420ms ease;
    }

    .status-occupied .status-line {
      color: var(--occupied);
    }

    .status-vacant .status-line {
      color: var(--vacant);
    }

    .status-alerted .status-line {
      color: var(--alerted);
      animation: pulse 1s ease-in-out infinite;
    }

    .status-alerted .status-card {
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.4), 0 0 26px rgba(239, 68, 68, 0.2) inset;
    }

    .error {
      margin-top: 16px;
      color: #fca5a5;
      font-size: 0.94rem;
      min-height: 22px;
    }

    .fade-in {
      animation: fadePop 350ms ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 0 rgba(239, 68, 68, 0.0); }
      50% { transform: scale(1.04); text-shadow: 0 0 20px rgba(239, 68, 68, 0.45); }
    }

    @keyframes fadePop {
      from { opacity: 0.5; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <main class="dashboard status-occupied" id="dashboard">
    <h1>Seat Checker Dashboard</h1>

    <section class="status-card" id="statusCard">
      <div class="status-line" id="statusLine">🟢 OCCUPIED</div>
      <div class="subtext" id="subtext">Monitoring live seat status...</div>
    </section>

    <section class="progress-wrap" id="progressWrap">
      <div class="progress-head">
        <span>Vacancy Timer</span>
        <span id="progressLabel">0.0 / 10.0s</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <div class="error" id="errorMsg"></div>
  </main>

  <script>
    // Same-origin when opened via http://127.0.0.1:5000/dashboard (recommended).
    const API_URL = "/seat_timer";
    const ALERT_THRESHOLD_SECONDS = 10;

    const dashboard = document.getElementById("dashboard");
    const statusLine = document.getElementById("statusLine");
    const subtext = document.getElementById("subtext");
    const progressWrap = document.getElementById("progressWrap");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");
    const errorMsg = document.getElementById("errorMsg");

    let lastState = "";

    function formatSeconds(seconds) {
      const value = Number.isFinite(seconds) ? Math.max(0, seconds) : 0;
      return `${value.toFixed(1)}s`;
    }

    function setStatusUI(state, elapsed) {
      dashboard.classList.remove("status-occupied", "status-vacant", "status-alerted");
      dashboard.classList.add(`status-${state}`);

      if (state !== lastState) {
        dashboard.classList.remove("fade-in");
        void dashboard.offsetWidth;
        dashboard.classList.add("fade-in");
      }

      if (state === "occupied") {
        statusLine.textContent = "🟢 OCCUPIED";
        subtext.textContent = "Seat is currently in use.";
      } else if (state === "vacant") {
        statusLine.textContent = "🟡 VACANT";
        subtext.textContent = `Vacant for ${formatSeconds(elapsed)}`;
      } else if (state === "alerted") {
        statusLine.textContent = "🔴 ALERTED";
        subtext.textContent = `Alert active — vacant for ${formatSeconds(elapsed)}`;
      } else {
        statusLine.textContent = "⚪ UNKNOWN";
        subtext.textContent = "Unexpected state from API.";
      }

      const shouldShowProgress = state === "vacant" || state === "alerted";
      progressWrap.style.opacity = shouldShowProgress ? "1" : "0.4";

      const percent = Math.min((elapsed / ALERT_THRESHOLD_SECONDS) * 100, 100);
      progressFill.style.width = `${percent}%`;
      progressLabel.textContent = `${formatSeconds(elapsed)} / ${ALERT_THRESHOLD_SECONDS.toFixed(1)}s`;

      lastState = state;
    }

    async function pollSeatTimer() {
      try {
        const response = await fetch(API_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const state = String(data.state || "").toLowerCase();
        const elapsed = Number(data.elapsed || 0);

        setStatusUI(state, elapsed);
        errorMsg.textContent = "";
      } catch (error) {
        errorMsg.textContent =
          `Cannot reach ${API_URL}. Start Flask with: python app.py then open http://127.0.0.1:5000/dashboard`;
      }
    }

    pollSeatTimer();
    setInterval(pollSeatTimer, 1000);
  </script>
</body>
</html>
